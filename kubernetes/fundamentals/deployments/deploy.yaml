apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scott-web
  name: scott-web
spec:
  replicas: 10
  selector:
    matchLabels:
      app: scott-web
  template:
    metadata:
      labels:
        app: scott-web
    spec:
      containers:
      - image: httpd:alpine3.23
        name: httpd
        command: ["/bin/bash", "-c"] # override the default command
        args: ["sleep 5; exit 1"] # sleep for 5 seconds then exit with an error
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
